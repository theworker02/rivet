name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "setuptools==81.0.0"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q src drivers sdk tests
      - run: python -m rivet version
      - run: python -m rivet run --simulate --fault motion.left-wheel
      - run: python -m build --no-isolation --skip-dependency-check --wheel
      - run: python -m build --no-isolation --skip-dependency-check --sdist
