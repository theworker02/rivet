name: Documentation validation

on:
  push:
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "site/**"
      - "tools/site/**"
      - "src/rivet/audit.py"
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "setuptools==81.0.0"
      - run: python -m pip install --no-deps -e .
      - run: python tools/site/build.py
      - run: python -m rivet check-release --skip-tests --skip-build
      - name: Confirm generated site status
        run: python -c "from pathlib import Path; text=Path('site-build/index.html').read_text(encoding='utf-8').lower(); assert '1.2.0' in text and 'verification-gated' in text"
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-site
          path: site-build/
