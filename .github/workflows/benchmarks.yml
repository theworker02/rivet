name: Runtime budgets

on:
  pull_request:
  workflow_dispatch:

jobs:
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "setuptools==81.0.0"
      - run: python -m pip install --no-deps -e .
      - run: python -m rivet resource-test
      - run: python -m rivet benchmark runtime
