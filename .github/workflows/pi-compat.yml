name: Pi compatibility smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "drivers/**"
      - "pyproject.toml"

jobs:
  import-without-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps -e .
      - run: python -c "import rivet; print(rivet.__version__)"
      - run: python -m rivet run --simulate
      - run: python -m pytest tests/hardware tests/simulation

# Physical ARM and GPIO validation is intentionally not claimed until a real
# self-hosted runner and maintained wiring fixture are configured.
